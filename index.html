cise">'+names.map(n=>`<option>${esc(n)}</option>`).join('')+'</select><div id="graph"></div>';let draw=()=>{let n=c.querySelector('select').value;let points=mine().flatMap(r=>r.ejercicios.filter(e=>norm(e.nombre)===norm(n)).map(e=>({date:r.fecha,w:Number(e.peso)}))).sort((a,b)=>a.date.localeCompare(b.date));if(!points.length){c.querySelector('#graph').textContent='Todavía no hay marcas.';return}let max=Math.max(1,...points.map(p=>p.w));let xy=points.map((p,i)=>[45+i* (510/Math.max(1,points.length-1)),190-150*p.w/max]);c.querySelector('#graph').innerHTML=`<p>Récord: <b>${Math.max(...points.map(p=>p.w))} kg</b></p><svg class="graph" viewBox="0 0 600 220"><path d="M45 20V190H560" stroke="#666" fill="none"/><polyline points="${xy.map(p=>p.join(',')).join(' ')}" stroke="#ffda25" stroke-width="3" fill="none"/>${xy.map(([x,y],i)=>`<circle cx="${x}" cy="${y}" r="5" fill="#ffda25"><title>${points[i].date}: ${points[i].w} kg</title></circle>`).join('')}</svg>`+points.map(p=>`<p>${p.date} · ${p.w} kg</p>`).join('')};c.querySelector('select').onchange=draw;draw()}
if(tab==='Rankings'){c.innerHTML='<h2>Rankings mensuales</h2><input id="month" type="month"><select id="metric"><option>Constancia</option><option>Fuerza</option><option>Evolución</option><option>Récords</option><option>Variedad</option></select><small id="rule"></small><div id="scores"></div>';c.querySelector('#month').value=new Date().toISOString().slice(0,7);let draw=()=>{let month=c.querySelector('#month').value,k=c.querySelector('#metric').value;let rules={Constancia:'Días distintos de entrenamiento',Fuerza:'Mayor peso individual (kg; ejercicios distintos no son equivalentes)',Evolución:'Mayor mejora porcentual frente a una marca anterior del mismo ejercicio',Récords:'Nuevas marcas superiores a una marca previa del mismo ejercicio',Variedad:'Ejercicios distintos'};c.querySelector('#rule').textContent=rules[k];let scores=people.filter(p=>p.rol==='usuaria').map(p=>{let all=rows.filter(r=>r.usuaria_id===p.id).sort((a,b)=>a.fecha.localeCompare(b.fecha));let rs=all.filter(r=>r.fecha.startsWith(month)),es=rs.flatMap(r=>r.ejercicios),best={},gain=0,recs=0;for(let r of all){if(r.fecha.slice(0,7)>month)break;for(let e of r.ejercicios){let n=e.nombre.trim().toLowerCase(),w=Number(e.peso),old=best[n];if(old!==undefined&&w>old&&r.fecha.startsWith(month)){recs++;if(old>0)gain=Math.max(gain,100*(w-old)/old)}best[n]=Math.max(old??0,w)}}return {n:p.nombre,v:({Constancia:new Set(rs.map(r=>r.fecha)).size,Fuerza:Math.max(0,...es.map(e=>Number(e.peso))),Evolución:Math.round(gain*10)/10,Récords:recs,Variedad:new Set(es.map(e=>e.nombre.trim().toLowerCase())).size})[k]}}).sort((a,b)=>b.v-a.v);c.querySelector('#scores').innerHTML=scores.map((p,i)=>`<div class="rankrow"><span>${scores.findIndex(q=>q.v===p.v)+1}</span><b>${esc(p.n)}</b><strong>${p.v}${k==='Fuerza'?' kg':k==='Evolución'?' %':''}</strong></div>`).join('')||'<p>Sin usuarias activadas.</p>'};c.querySelector('#month').onchange=draw;c.querySelector('#metric').onchange=draw;draw()}
if(tab==='Medallas'){let defs=MEDS;c.innerHTML='<h2>Medallas Divilove</h2><div class="medgrid"></div>';if(profile.rol==='administrador'){c.innerHTML+='<p>Las medallas están reservadas a las Diviloves.</p>'}else Promise.all([db.from('medallas').select('*').eq('usuaria_id',user.id),db.rpc('progreso_medallas')]).then(([r,v])=>{if(r.error||v.error)return err(r.error||v.error);if(tab!=='Medallas'||!c.isConnected)return;c.querySelector('.medgrid').innerHTML=defs.map(([n,emoji,target,desc,color],i)=>{let m=r.data.find(m=>m.codigo===n);if(i>=20&&!m)return `<div class="medtile locked"><div class="medicon">🔒</div><b>Medalla secreta</b><p>¡Sorpresa!</p></div>`;let progress=m?target:Math.min(target,v.data?.[i]||0);return `<div class="medtile ${m?'earned':'locked'}" style="--medcolor:${color}"><div class="medicon">${emoji}</div><b>${esc(n)}</b><p><small>${desc}</small></p><div class="medprogress"><i style="width:${100*progress/target}%"></i></div><small>${progress} / ${target}</small><p><small>${m?'Conseguida: '+new Date(m.conseguida_en).toLocaleDateString('es-ES'):'Pendiente'}</small></p></div>`}).join('')})}if(tab==='Muro'){c.innerHTML='<h2>Muro Divilove</h2><textarea id="post" placeholder="Comparte algo"></textarea><button id="publish">Publicar</button><div id="posts"></div>';c.querySelector('#publish').onclick=async()=>{let mensaje=c.querySelector('#post').value.trim();if(!mensaje)return;let r=await db.from('muro').insert({usuaria_id:user.id,tipo:'mensaje',mensaje});if(r.error)err(r.error);else render()};db.from('muro').select('*,reacciones(*)').order('creado_en',{ascending:false}).then(r=>{if(!r.error&&tab==='Muro')c.querySelector('#posts').innerHTML=r.data.map(p=>`<section><b>${esc(name(p.usuaria_id))}</b><p>${esc(p.mensaje)}</p>${['💪','🔥','👏','❤️'].map(em=>`<button class="reaction ${p.reacciones.some(x=>x.usuaria_id===user.id&&x.emoji===em)?'on':''}" data-post="${p.id}" data-emoji="${em}">${em} ${p.reacciones.filter(x=>x.emoji===em).length}</button>`).join('')}</section>`).join('');c.querySelectorAll('[data-post]').forEach(b=>b.onclick=async()=>{let q=b.classList.contains('on')?await db.from('reacciones').delete().eq('publicacion_id',b.dataset.post).eq('usuaria_id',user.id).eq('emoji',b.dataset.emoji):await db.from('reacciones').insert({publicacion_id:b.dataset.post,usuaria_id:user.id,emoji:b.dataset.emoji});if(q.error)err(q.error);else render()})})}}
async function celebrate(m){let q=await db.rpc('celebracion_semanal');if(q.error)err(q.error);let messages=m.map(n=>['🏅','¡Nueva medalla: '+n+'!']);if(q.data===true)messages.push(['🍹','¡Tres entrenos esta semana! ¡Esta semana me puedo tomar un cubatita!']);for(let [emoji,msg] of messages){await new Promise(resolve=>{let overlay=document.createElement('div');overlay.className='celebrate';overlay.innerHTML='<div><span>'+emoji+'</span><h2>'+esc(msg)+'</h2><button>Continuar</button></div>';document.body.append(overlay);let done=()=>{overlay.remove();resolve()};overlay.querySelector('button').onclick=done;setTimeout(done,5000)})}}
