if(tab==='Rankings'){c.innerHTML='<h2>Rankings mensuales</h2><input id="month" type="month"><select id="metric"><option>Constancia</option><option>Fuerza</option><option>Evolución</option><option>Récords</option><option>Variedad</option></select><small id="rule"></small><div id="scores"></div>';c.querySelector('#month').value=new Date().toISOString().slice(0,7);let draw=()=>{let month=c.querySelector('#month').value,k=c.querySelector('#metric').value;let rules={Constancia:'Sesiones registradas',Fuerza:'Mayor peso individual (kg; ejercicios distintos no son equivalentes)',Evolución:'Mayor mejora porcentual frente a una marca anterior del mismo ejercicio',Récords:'Nuevas marcas superiores a una marca previa del mismo ejercicio',Variedad:'Ejercicios distintos'};c.querySelector('#rule').textContent=rules[k];let scores=people.filter(p=>p.rol==='usuaria').map(p=>{let all=rows.filter(r=>r.usuaria_id===p.id).sort((a,b)=>a.fecha.localeCompare(b.fecha));let rs=all.filter(r=>r.fecha.startsWith(month)),es=rs.flatMap(r=>r.ejercicios),best={},gain=0,recs=0;for(let r of all){if(r.fecha.slice(0,7)>month)break;for(let e of r.ejercicios){let n=e.nombre.trim().toLowerCase(),w=Number(e.peso),old=best[n];if(old!==undefined&&w>old&&r.fecha.startsWith(month)){recs++;if(old>0)gain=Math.max(gain,100*(w-old)/old)}best[n]=Math.max(old??0,w)}}return {n:p.nombre,v:({Constancia:rs.length,Fuerza:Math.max(0,...es.map(e=>Number(e.peso))),Evolución:Math.round(gain*10)/10,Récords:recs,Variedad:new Set(es.map(e=>e.nombre.trim().toLowerCase())).size})[k]}}).sort((a,b)=>b.v-a.v);c.querySelector('#scores').innerHTML=scores.map((p,i)=>`<div class="rankrow"><span>${scores.findIndex(q=>q.v===p.v)+1}</span><b>${esc(p.n)}</b><strong>${p.v}${k==='Fuerza'?' kg':k==='Evolución'?' %':''}</strong></div>`).join('')||'<p>Sin usuarias activadas.</p>'};c.querySelector('#month').onchange=draw;c.querySelector('#metric').onchange=draw;draw()}
