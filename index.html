or('#diag').onclick=async()=>{let r=await Promise.all(['perfiles','entrenamientos','medallas','catalogo_ejercicios','muro'].map(async t=>{let q=await db.from(t).select('*',{count:'exact',head:true});return {t,error:q.error?.message,count:q.count}}));panel.querySelector('#diagout').innerHTML=r.map(x=>`<div class="diagrow"><span class="${x.error?'bad':'good'}">${x.error?'● Error':'● OK'}</span><b>${esc(x.t)}</b><small>${esc(x.error||String(x.count)+' registros')}</small></div>`).join('');let status=panel.querySelector('#connstatus');status.textContent=r.some(x=>x.error)?'Revisar':'Operativa';status.className=r.some(x=>x.error)?'bad':'good'};panel.querySelector('#backup').onclick=async()=>{let data={};for(let t of ['perfiles','entrenamientos','ejercicios','medallas','catalogo_ejercicios','muro','reacciones']){let a=[],i=0;while(true){let q=await db.from(t).select('*').order(t==='catalogo_ejercicios'?'nombre':'id').range(i,i+499);if(q.error)return err(q.error);a.push(...q.data);if(q.data.length<500)break;i+=500}data[t]=a}let u=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:'application/json'})),a=document.createElement('a');a.href=u;a.download='BOX-428-backup-'+new Date().toISOString().slice(0,10)+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)};panel.querySelector('#rename').onclick=async()=>{let a=panel.querySelector('#oldname').value,b=canonical(panel.querySelector('#newname').value);if(!a||!b||!confirm('¿Renombrar '+a+' a '+b+' en el historial y catálogo?'))return;let q=await db.rpc('renombrar_ejercicio_admin',{p_anterior:a,p_nuevo:b});if(q.error)err(q.error);else refresh()};panel.querySelector('#inv').onclick=async()=>{let q=await db.rpc('invitaciones_admin');if(q.error)return err(q.error);panel.querySelector('#invout').innerHTML=q.data.map(x=>`<p>${esc(x.nombre)} · ${x.utilizada?'Activada':'Pendiente'} ${x.utilizada?'':`<button data-rotate="${x.id}">Renovar código</button>`}</p>`).join('');panel.querySelectorAll('[data-rotate]').forEach(b=>b.onclick=async()=>{if(!confirm('¿Invalidar código anterior?'))return;let r=await db.rpc('renovar_invitacion_admin',{p_id:b.dataset.rotate});if(r.error)return err(r.error);prompt('Nuevo código de invitación',r.data)})}}
