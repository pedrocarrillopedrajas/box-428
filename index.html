const db=createClient('https://yaxsbchspeenxwkkddli.supabase.co','sb_publishable_4Ft6qI5DMJ-SBMrfXBsvMQ_P7jlyFJ8');const app=document.querySelector('#app');let user,profile,rows=[],people=[],tab='Inicio';const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const err=e=>{document.querySelector('#msg').textContent=e.message||e};const today=()=>new Date().toLocaleDateString('en-CA');let draft=[];async function load(){let r=await db.auth.getUser();user=r.data.user;if(!user){login();return}let p=await db.from('perfiles').select('*').eq('id',user.id).maybeSingle();if(p.error){app.textContent=p.error.message;return}profile=p.data;if(!profile){app.innerHTML='<section><h2>Activa tu invitación</h2><input id="code" placeholder="Código privado"><button id="activate">Activar</button><button id="logout">Salir</button><p id="msg" class="error"></p></section>';document.querySelector('#activate').onclick=async()=>{let r=await db.rpc('activar_invitacion',{p_codigo:document.querySelector('#code').value});if(r.error)err(r.error);else load()};document.querySelector('#logout').onclick=logout;return}await refresh()}

.exercise')].map(d=>Object.fromEntries([...d.querySelectorAll('input')].map(i=>[i.name,i.value])));if(!es.length)return err('Añade un ejercicio');let b=f.querySelector('button:not([type])');b.disabled=true;let r=await db.from('entrenamientos').insert({usuaria_id:user.id,fecha:f.fecha.value,tipo:f.tipo.value}).select().single();if(r.error){b.disabled=false;return err(r.error)}let q=await db.from('ejercicios').insert(es.map(x=>({...x,peso:Number(x.peso),porcentaje:x.porcentaje===''?null:Number(x.porcentaje),entrenamiento_id:r.data.id})));if(q.error){await db.from('entrenamientos').delete().eq('id',r.data.id);b.disabled=false;return err(q.error)}tab='Historial';refresh()}}if(tab==='Historial'||tab==='Administración'){let rs=tab==='Historial'?mine():rows;c.innerHTML='<h2>'+tab+'</h2>'+rs.map(r=>`<section><b>${esc(name(r.usuaria_id))} · ${esc(r.tipo)}</b><input type="date" data-date="${r.id}" value="${r.fecha}">${r.ejercicios.map(e=>`<p>${esc(e.nombre)} — ${e.peso} kg ${esc(e.repeticiones||'')}</p>`).join('')}<button data-del="${r.id}">Eliminar</button></section>`).join('');c.querySelectorAll('[data-date]').forEach(i=>i.onchange=async()=>{let r=await db.from('entrenamientos').update({fecha:i.value}).eq('id',i.dataset.date);if(r.error)err(r.error);else refresh()});c.querySelectorAll('[data-del]').forEach(i=>i.onclick=async()=>{if(confirm('¿Eliminar entrenamiento?')){let r=await db.from('entrenamientos').delete().eq('id',i.dataset.del);if(r.error)err(r.error);else refresh()}})}if(tab==='Evolución'){let names=[...new Set(mine().flatMap(r=>r.ejercicios.map(e=>e.nombre)))];c.innerHTML='<h2>Evolución</h2><select id="exercise">'+names.map(n=>`<option>${esc(n)}</option>`).join('')+'</select><div id="graph"></div>';let draw=()=>{let n=c.querySelector('select').value;let points=mine().flatMap(r=>r.ejercicios.filter(e=>e.nombre===n).map(e=>({date:r.fecha,w:Number(e.peso)}))).sort((a,b)=>a.date.localeCompare(b.date));let max=Math.max(1,...points.map(p=>p.w));c.querySelector('#graph').innerHTML=points.map(p=>`<p>${p.date} · ${p.w} kg</p><div style="background:#ffd600;height:12px;width:${100*p.w/max}%"></div>`).join('')};c.querySelector('select').onchange=draw;draw()}if(tab==='Rankings'){let month=new Date().toISOString().slice(0,7);let scores=people.filter(p=>p.rol==='usuaria').map(p=>({n:p.nombre,v:rows.filter(r=>r.usuaria_id===p.id&&r.fecha.startsWith(month)).length})).sort((a,b)=>b.v-a.v);c.innerHTML='<h2>Constancia del mes</h2>'+scores.map((p,i)=>`<p>${i+1}. ${esc(p.n)} — ${p.v} entrenamientos</p>`).join('')}if(tab==='Medallas'){c.innerHTML='<h2>Medallas</h2><p>Los logros automáticos se incorporarán en la siguiente versión.</p>';db.from('medallas').select('*').eq('usuaria_id',user.id).then(r=>{if(!r.error&&tab==='Medallas')c.insertAdjacentHTML('beforeend',r.data.map(m=>`<p>🏅 ${esc(m.codigo)}</p>`).join(''))})}if(tab==='Muro'){c.innerHTML='<h2>Muro Divilove</h2><textarea id="post" placeholder="Comparte algo"></textarea><button id="publish">Publicar</button><div id="posts"></div>';c.querySelector('#publish').onclick=async()=>{let mensaje=c.querySelector('#post').value.trim();if(!mensaje)return;let r=await db.from('muro').insert({usuaria_id:user.id,tipo:'mensaje',mensaje});if(r.error)err(r.error);else render()};db.from('muro').select('*').order('creado_en',{ascending:false}).then(r=>{if(!r.error&&tab==='Muro')c.querySelector('#posts').innerHTML=r.data.map(p=>`<section><b>${esc(name(p.usuaria_id))}</b><p>${esc(p.mensaje)}</p></section>`).join('')})}}
